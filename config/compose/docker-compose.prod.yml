name: framily

services:
  postgres:
    image: postgres:16-alpine
    container_name: framily-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: framily-garage
    restart: unless-stopped
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET}
    volumes:
      - ../garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    command: /garage server --single-node --default-bucket
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${S3_PORT}:3900"

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    container_name: framily-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_SECURE: ${S3_SECURE}
      SECRET_KEY: ${SECRET_KEY}
      TITLE: ${TITLE}
      VERSION: ${VERSION}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SERVE_FRONTEND: true
      FRONTEND_DIST_DIR: /app/frontend-build
      BACKEND_WORKERS: ${BACKEND_WORKERS}
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${APP_PORT}:8000"

volumes:
  postgres_data:
  garage_meta:
  garage_data:
